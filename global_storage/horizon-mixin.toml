# Global Storage for Horizon: one big storage every player fills and empties from a chest menu
# (/gs), with search, sorting and no stack limit. Server side only: players need nothing
# installed. Settings: config/global_storage/global-storage.toml; the items are kept in the
# world, world/global_storage/*.dat, so the world's backups carry them.
[mod]
id = "global_storage"
version = "1.0.0"

# The glue moves stacks in and out of the players' inventories through the hub's own records
# (as native_exchange_items does), so the mod is pinned to the Horizon commit it was built and
# checked on, the same as the other server mods.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The storage, search, sorting and menu layout: a crate without the game, tested on its own
# (`cargo test` in core/).
[[crate]]
id = "core"
path = "core"
dependent = "horizon-client"

# /gs, the menu, the inventories and the files.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "global_storage_glue"
source = "glue.rs"

[[injection]]
id = "register"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "menu-clicked"
hook = "menu_clicked"
hook_version = 1
kind = "HEAD"
helper = "menu_clicked.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
  { name = "slot", ty = "i32", value = "slot" },
  { name = "button", ty = "i32", value = "button" },
  { name = "mode", ty = "i32", value = "mode" },
]

[[injection]]
id = "menu-closed"
hook = "menu_closed"
hook_version = 1
kind = "HEAD"
helper = "menu_closed.rs"
bindings = [
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
]

[[injection]]
id = "saved"
hook = "world_saved"
hook_version = 1
kind = "HEAD"
helper = "saved.rs"
bindings = []

[[injection]]
id = "stopping"
hook = "server_stopping"
hook_version = 1
kind = "HEAD"
helper = "stopping.rs"
bindings = []

# The "Сховище: відкрити склад" key of the serverkeys client mod (default I): the client sends
# `global_storage:open` on `serverkeys:action`, and the storage opens as with /gs.
[[injection]]
id = "key"
hook = "net_from_client"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]
